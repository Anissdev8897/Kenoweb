# Configuration Render pour Keno Analyzer Pro
services:
  - type: web
    name: keno-analyzer-pro
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      python src/main.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keno-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: 10000
    disk:
      name: keno-data
      mountPath: /app/data
      sizeGB: 10

databases:
  - name: keno-db
    databaseName: keno_analyzer
    user: keno_user
    plan: starter
    postgresExtensions:
      - uuid-ossp
      - pgcrypto
