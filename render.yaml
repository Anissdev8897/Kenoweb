# Configuration Render pour Keno Analyzer Pro
services:
  - type: web
    name: keno-analyzer-pro
    env: python
    buildCommand: |
      pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: gunicorn --timeout 120 --workers 2 --bind 0.0.0.0:$PORT main:app
    healthCheckPath: /health
    healthCheckTimeout: 30
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: keno-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: keno-data
      mountPath: /app/data
      sizeGB: 10

databases:
  - name: keno-db
    databaseName: keno_analyzer
    user: keno_user
    plan: starter
    postgresExtensions:
      - uuid-ossp
      - pgcrypto
