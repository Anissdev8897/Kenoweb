<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keno Analyzer Pro - Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .title {
            font-size: 1.8rem;
            color: #667eea;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-bottom: 15px;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }
        
        .link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        .error {
            color: #e74c3c;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .success {
            color: #27ae60;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .login-options {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }
        
        .login-options h3 {
            margin-bottom: 15px;
            color: #667eea;
        }
        
        .option {
            margin: 10px 0;
        }
        
        .anonymous-note {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🔮</div>
        <h1 class="title">Keno Analyzer Pro</h1>
        
        <div id="messages"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required="">
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required="">
            </div>
            
            <button type="submit" class="btn">Se connecter</button>
        </form>
        
        <div class="login-options">
            <div class="option">
                <a href="/register" class="link">Pas encore de compte ? S'inscrire</a>
            </div>
            
            <div class="option">
                <a href="/analyser" class="link" onclick="anonymousAccess()">Accès anonyme</a>
                <div class="anonymous-note">(Accès limité - sans chat ni optimisation)</div>
            </div>
        </div>
    </div>

    <script>
        // Gérer la soumission du formulaire
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            login();
        });

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                showMessage('Veuillez remplir tous les champs', 'error');
                return;
            }

            // Soumettre le formulaire
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            fetch('/login', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(html => {
                // Vérifier si la connexion a réussi
                if (html.includes('/analyser')) {
                    window.location.href = '/analyser';
                } else {
                    // Extraire le message d'erreur de la réponse HTML
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const error = doc.querySelector('.error-message')?.textContent || doc.querySelector('.error')?.textContent || 'Erreur de connexion';
                    showMessage(error, 'error');
                }
            })
            .catch(error => {
                showMessage('Erreur de connexion au serveur', 'error');
            });
        }

        function anonymousAccess() {
            // Accès anonyme - rediriger vers analyser avec mode anonyme
            window.location.href = '/analyser?mode=anonymous';
        }

        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = `<div class="${type}">${message}</div>`;
            
            // Effacer le message après 5 secondes
            setTimeout(() => {
                messagesDiv.innerHTML = '';
            }, 5000);
        }

        // Vérifier si l'utilisateur est déjà connecté
        fetch('/api/user/status')
            .then(response => response.json())
            .then(data => {
                if (data.logged_in) {
                    window.location.href = '/analyser';
                }
            });
    </script>
</body>
</html>
