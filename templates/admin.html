<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Keno Analyzer Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f8f9fa;
            font-weight: bold;
        }

        .status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.active {
            background: #d4edda;
            color: #155724;
        }

        .status.inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Administration - Keno Analyzer Pro</h1>
            <div>
                <a href="/analyser" class="btn btn-primary">Retour à l'analyseur</a>
                <a href="/logout" class="btn btn-danger">Déconnexion</a>
            </div>
        </div>

        <div id="messages"></div>

        <div class="card">
            <h2>Gestion du modèle</h2>
            <div class="form-group">
                <button id="retrain-full" class="btn btn-success">Relancer l'entraînement complet</button>
                <button id="retrain-incremental" class="btn btn-primary">Entraînement incrémental</button>
            </div>
            <div id="training-status" class="loading">
                <div class="spinner"></div>
                <p>Entraînement en cours...</p>
            </div>
        </div>

        <div class="card">
            <h2>Gestion des modérateurs</h2>
            <form id="moderator-form">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Ajouter modérateur</button>
            </form>
        </div>

        <div class="card">
            <h2>Liste des utilisateurs</h2>
            <table id="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom d'utilisateur</th>
                        <th>Email</th>
                        <th>Rôle</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Charger les utilisateurs
        function loadUsers() {
            fetch('/api/admin/users')
                .then(response => response.json())
                .then(users => {
                    const tbody = document.getElementById('users-tbody');
                    tbody.innerHTML = '';
                    
                    users.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${user.email}</td>
                            <td>${user.is_admin ? 'Admin' : user.is_moderator ? 'Modérateur' : 'Utilisateur'}</td>
                            <td><span class="status ${user.is_active ? 'active' : 'inactive'}">${user.is_active ? 'Actif' : 'Inactif'}</span></td>
                            <td>
                                <button onclick="toggleUserStatus('${user.id}', ${!user.is_active})" class="btn ${user.is_active ? 'btn-danger' : 'btn-success'}">
                                    ${user.is_active ? 'Désactiver' : 'Activer'}
                                </button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                });
        }

        // Basculer le statut d'un utilisateur
        function toggleUserStatus(userId, newStatus) {
            fetch('/api/admin/users/' + userId + '/toggle', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ is_active: newStatus })
            })
            .then(response => response.json())
            .then(data => {
                showMessage(data.message, data.success ? 'success' : 'error');
                loadUsers();
            });
        }

        // Afficher un message
        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            messagesDiv.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Gestion du formulaire d'ajout de modérateur
        document.getElementById('moderator-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password'),
                is_moderator: true
            };

            fetch('/api/admin/moderators', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                showMessage(data.message, data.success ? 'success' : 'error');
                if (data.success) {
                    document.getElementById('moderator-form').reset();
                    loadUsers();
                }
            });
        });

        // Gestion des boutons d'entraînement
        document.getElementById('retrain-full').addEventListener('click', function() {
            startTraining('full');
        });

        document.getElementById('retrain-incremental').addEventListener('click', function() {
            startTraining('incremental');
        });

        function startTraining(type) {
            const statusDiv = document.getElementById('training-status');
            statusDiv.style.display = 'block';
            
            fetch('/api/admin/retrain', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ type: type })
            })
            .then(response => response.json())
            .then(data => {
                statusDiv.style.display = 'none';
                showMessage(data.message, data.success ? 'success' : 'error');
            });
        }

        // Charger les utilisateurs au chargement de la page
        loadUsers();
    </script>
</body>
</html>
