<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimisation & Chat Communauté - Keno Analyzer Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .card-header {
            background: linear-gradient(135deg, #E91E63, #C2185B);
            color: white;
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .chat-container {
            background: linear-gradient(135deg, #fce4ec, #f8bbd9);
            border: 2px solid #E91E63;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
        }
        
        .user-message {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            margin-left: auto;
            border-left: 4px solid #2196F3;
        }
        
        .bot-message {
            background: linear-gradient(135deg, #e8f5e8, #c8e6c9);
            border-left: 4px solid #4caf50;
        }
        
        .stats {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border: 1px solid #2196F3;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            color: #1565C0;
            font-weight: bold;
            text-align: center;
        }
        
        .btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: linear-gradient(135deg, #1976D2, #1565C0);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .input-field {
            flex: 1;
            padding: 12px;
            border: 2px solid #2196F3;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            transition: border-color 0.3s ease;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #E91E63;
            box-shadow: 0 0 0 2px rgba(233, 30, 99, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: white; margin-bottom: 30px;">
            ⚙️ Optimisation & Chat Communauté
        </h1>


        <!-- Chat Communauté -->
        <div class="card">
            <div class="card-header">
                👥 Chat Communauté
            </div>
            <div class="card-body">
                <div class="chat-container">
                    <div id="communityMessages" style="height: 400px; overflow-y: auto; border: 1px solid #E91E63; padding: 15px; background: linear-gradient(135deg, #fce4ec, #f8bbd9); border-radius: 8px;">
                        <div style="text-align: center; color: #C2185B; padding: 20px; font-weight: bold;">
                            👥 Bienvenue dans le chat communautaire ! Discutez avec d'autres joueurs de Keno.
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 10px; align-items: center; margin-top: 15px;">
                        <input type="text" id="communityMessage" placeholder="Tapez votre message..." 
                               style="flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; font-size: 14px;">
                        <button onclick="sendCommunityMessage()" 
                                style="padding: 12px 20px; background: linear-gradient(135deg, #E91E63, #C2185B); color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold;">
                            📤 Envoyer
                        </button>
                    </div>
                    <p>Chat communautaire...</p>
                </div>
            </div>
        </div>

    <script>
        let chatbotStats = { used: 0, limit: 3, remaining: 3 };

        // Charger les statistiques du chatbot
        function loadChatbotStats() {
            fetch('/api/chat/stats')
                .then(response => response.json())
                .then(data => {
                    chatbotStats = data;
                    updateChatbotStatsDisplay();
                })
                .catch(error => {
                    console.error('Erreur chargement stats:', error);
                });
        }

        function updateChatbotStatsDisplay() {
            const statsDiv = document.getElementById('chatbotStats');
            
            if (chatbotStats.limit_reached) {
                statsDiv.innerHTML = `
                    ⚠️ <strong>Limite atteinte !</strong><br>
                    ${chatbotStats.used}/3 requêtes utilisées aujourd'hui<br>
                    Revenez demain pour continuer
                `;
                statsDiv.style.background = 'linear-gradient(135deg, #ffebee, #ffcdd2)';
                statsDiv.style.color = '#c62828';
                
                document.getElementById('chatbotInput').disabled = true;
                document.querySelector('button[onclick="sendAssistantMessage()"]').disabled = true;
            } else {
                statsDiv.innerHTML = `
                    📊 <strong>Assistant Chabot KenoAI</strong><br>
                    ${chatbotStats.used}/${chatbotStats.limit} requêtes utilisées<br>
                    Il vous reste ${chatbotStats.remaining} requêtes aujourd'hui
                `;
            }
        }

        function loadLastDraw() {
            fetch('/api/last-draw')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const draw = data.draw;
                        const drawDiv = document.getElementById('lastDrawDisplay');
                        drawDiv.innerHTML = `
                            <div style="background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 8px; margin: 10px 0;">
                                <h4>🎯 Dernier Tirage</h4>
                                <p><strong>Date:</strong> ${draw.date}</p>
                                <p><strong>Numéros:</strong> ${draw.numbers.join(', ')}</p>
                                <p><strong>Multiplicateur:</strong> ${draw.multiplier}</p>
                                <p><strong>Joker:</strong> ${draw.joker}</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Erreur chargement dernier tirage:', error);
                });
        }

        function loadModelMetrics() {
            fetch('/api/model/metrics')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('modelAccuracy').textContent = 
                            (data.accuracy * 100).toFixed(1) + '%';
                        document.getElementById('dataPoints').textContent = 
                            data.data_points.toLocaleString();
                        document.getElementById('lastUpdate').textContent = 
                            new Date(data.last_update).toLocaleDateString('fr-FR');
                    }
                })
                .catch(error => {
                    console.error('Erreur chargement métriques:', error);
                    // Valeurs par défaut en cas d'erreur
                    document.getElementById('modelAccuracy').textContent = '85.2%';
                    document.getElementById('dataPoints').textContent = '4,847';
                    document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString('fr-FR');
                });
        }

        function sendAssistantMessage() {
            const message = document.getElementById('chatbotInput').value.trim();
            if (!message) return;

            if (chatbotStats.remaining <= 0) {
                alert('⚠️ Vous avez atteint la limite de 3 requêtes par jour. Revenez demain !');
                return;
            }

            // Afficher le message de l'utilisateur
            const chatMessages = document.getElementById('chatbotMessages');
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.innerHTML = `<strong>👤 Vous:</strong><br>${message}`;
            chatMessages.appendChild(userDiv);

            // Effacer l'input
            document.getElementById('chatbotInput').value = '';

            // Afficher indicateur de chargement
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot-message';
            loadingDiv.innerHTML = `
                <div class="message bot-message">
                    <strong>🤖 Assistant IA - Chatbot kenoai réfléchit...</strong>
                </div>
            `;
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Envoyer la requête
            fetch('/api/chatbot/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                // Retirer l'indicateur de chargement
                chatMessages.removeChild(loadingDiv);
                
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-message';
                
                if (data.error) {
                    botDiv.innerHTML = `<strong>❌ Assistant IA - Chatbot kenoai:</strong><br>${data.error}`;
                } else {
                    botDiv.innerHTML = `<strong>🤖 Assistant IA - Chatbot kenoai:</strong><br>${data.response}`;
                    
                    // Mettre à jour les statistiques
                    if (data.stats) {
                        chatbotStats = data.stats;
                        updateChatbotStatsDisplay();
                    }
                }
                
                chatMessages.appendChild(botDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            })
            .catch(error => {
                if (loadingDiv.parentNode) {
                    chatMessages.removeChild(loadingDiv);
                }
                
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message bot-message';
                errorDiv.innerHTML = `<strong>❌ Erreur:</strong><br>${error}`;
                chatMessages.appendChild(errorDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        // Envoyer avec la touche Entrée
        document.getElementById('chatbotInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendAssistantMessage();
            }
        });

        // Charger les données au démarrage
        document.addEventListener('DOMContentLoaded', function() {
            loadChatbotStats();
            loadLastDraw();
            loadModelMetrics();
            
            // Rafraîchir les stats toutes les 30 secondes
            setInterval(loadChatbotStats, 30000);
            setInterval(loadModelMetrics, 60000); // Rafraîchir les métriques toutes les minutes
        });
    </script>

    <script>
        // Fonction pour envoyer un message dans le chat communautaire
        function sendCommunityMessage() {
            const messageInput = document.getElementById('communityMessage');
            const message = messageInput.value.trim();
            
            if (!message) return;
            
            const communityMessages = document.getElementById('communityMessages');
            const messageDiv = document.createElement('div');
            messageDiv.style.cssText = 'background: linear-gradient(135deg, #fff, #f8bbd9); margin: 10px 0; padding: 10px; border-radius: 8px; border-left: 3px solid #E91E63; font-size: 14px;';
            
            const timestamp = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            messageDiv.innerHTML = '<div style="font-weight: bold; color: #C2185B;">Vous (' + timestamp + ')</div><div style="margin-top: 5px;">' + message + '</div>';
            
            communityMessages.appendChild(messageDiv);
            messageInput.value = '';
            communityMessages.scrollTop = communityMessages.scrollHeight;
            
            // Simuler une réponse de la communauté
            setTimeout(function() {
                const responseDiv = document.createElement('div');
                responseDiv.style.cssText = 'background: linear-gradient(135deg, #fff3e0, #f8bbd9); margin: 10px 0; padding: 10px; border-radius: 8px; border-left: 3px solid #FF9800; font-size: 14px;';
                responseDiv.innerHTML = '<div style="font-weight: bold; color: #FF9800;">Communauté Keno</div><div style="margin-top: 5px;">👋 Bienvenue dans le chat ! Discutez avec d\'autres passionnés de Keno FDJ.</div>';
                communityMessages.appendChild(responseDiv);
                communityMessages.scrollTop = communityMessages.scrollHeight;
            }, 1000);
        }
        
        // Permettre l'envoi avec la touche Entrée
        document.getElementById('communityMessage').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendCommunityMessage();
            }
        });
    </script>
</body>
</html>
