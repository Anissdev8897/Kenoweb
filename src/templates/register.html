<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keno Analyzer Pro - Inscription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .register-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .title {
            font-size: 1.8rem;
            color: #667eea;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-bottom: 15px;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }
        
        .link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        .error {
            color: #e74c3c;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .success {
            color: #27ae60;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .requirements {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: -15px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">🔮</div>
        <h1 class="title">Créer un compte</h1>
        
        <div id="messages"></div>
        
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
                <div class="requirements">Minimum 6 caractères</div>
            </div>
            
            <div class="form-group">
                <label for="confirm">Confirmer le mot de passe</label>
                <input type="password" id="confirm" name="confirm" required>
            </div>
            
            <button type="submit" class="btn">Créer mon compte</button>
        </form>
        
        <div style="margin-top: 20px;">
            <a href="/login" class="link">Déjà un compte ? Se connecter</a>
        </div>
    </div>

    <script>
        // Gérer la soumission du formulaire
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            register();
        });

        function register() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirm = document.getElementById('confirm').value.trim();
            
            // Validation
            if (!username || !email || !password || !confirm) {
                showMessage('Veuillez remplir tous les champs', 'error');
                return;
            }
            
            if (password !== confirm) {
                showMessage('Les mots de passe ne correspondent pas', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }

            // Soumettre le formulaire
            const formData = new FormData();
            formData.append('username', username);
            formData.append('email', email);
            formData.append('password', password);
            formData.append('confirm', confirm);

            fetch('/auth/register', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(html => {
                // Vérifier si l'inscription a réussi
                if (html.includes('Compte créé') || html.includes('analyser')) {
                    window.location.href = '/analyser';
                } else {
                    // Extraire le message d'erreur de la réponse HTML
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const error = doc.querySelector('.error')?.textContent || 'Erreur d\'inscription';
                    showMessage(error, 'error');
                }
            })
            .catch(error => {
                showMessage('Erreur de connexion au serveur', 'error');
            });
        }

        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = `<div class="${type}">${message}</div>`;
            
            // Effacer le message après 5 secondes
            setTimeout(() => {
                messagesDiv.innerHTML = '';
            }, 5000);
        }

        // Vérifier si l'utilisateur est déjà connecté
        fetch('/api/user/status')
            .then(response => response.json())
            .then(data => {
                if (data.logged_in) {
                    window.location.href = '/analyser';
                }
            });
    </script>
</body>
</html>
